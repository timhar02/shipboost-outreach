name: Cron - process pending launches

# Drain the deferred-launch queue. Each call processes up to 5 launches.
# GitHub runs "*/5" schedules only a few times a day in practice, so every
# scheduled run loops (up to 12 calls, ~60 launches) and stops early once the
# queue is empty. Manual dispatch picks its own number of calls.
on:
  schedule:
    - cron: "*/5 0-16 * * *"
  workflow_dispatch:
    inputs:
      drain_runs:
        description: "Number of process-pending calls to make, 1-20"
        required: false
        default: "1"
      drain_sleep_seconds:
        description: "Seconds to wait between manual drain calls"
        required: false
        default: "5"

concurrency:
  group: cron-process-pending
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Call process-pending endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRAIN_RUNS: ${{ github.event.inputs.drain_runs || '12' }}
          DRAIN_SLEEP_SECONDS: ${{ github.event.inputs.drain_sleep_seconds || '5' }}
        run: |
          set -e
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL and CRON_SECRET secrets must be set"; exit 1
          fi

          RUNS="$DRAIN_RUNS"
          SLEEP_SECONDS="$DRAIN_SLEEP_SECONDS"
          case "$RUNS" in ''|*[!0-9]*) RUNS=1 ;; esac
          case "$SLEEP_SECONDS" in ''|*[!0-9]*) SLEEP_SECONDS=5 ;; esac
          if [ "$RUNS" -lt 1 ]; then RUNS=1; fi
          if [ "$RUNS" -gt 20 ]; then RUNS=20; fi
          if [ "$SLEEP_SECONDS" -gt 60 ]; then SLEEP_SECONDS=60; fi

          URL="${APP_URL%/}/api/cron/process-pending?batch=5"
          for i in $(seq 1 "$RUNS"); do
            echo "Calling ($i/$RUNS): $URL"
            STATUS=$(curl -sSL -o /tmp/out.json -w "%{http_code}" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 90 \
              "$URL")
            echo "HTTP $STATUS"
            cat /tmp/out.json
            [ "$STATUS" = "200" ]
            REMAINING=$(jq -r '.remaining // empty' /tmp/out.json 2>/dev/null || true)
            if [ "$REMAINING" = "0" ]; then echo "Queue empty"; break; fi
            if [ "$i" -lt "$RUNS" ]; then sleep "$SLEEP_SECONDS"; fi
          done
