name: Cron - process pending launches

# Drain the deferred-launch queue. Each call processes up to 5 launches.
# Runs every 10 min during 09:00-16:00 UTC after the daily fetch.
on:
  schedule:
    - cron: "*/10 9-16 * * *"
  workflow_dispatch:

concurrency:
  group: cron-process-pending
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call process-pending endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          URL="${APP_URL%/}/api/cron/process-pending"
          echo "Calling: $URL"
          STATUS=$(curl -sSL -o /tmp/out.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 90 \
            "$URL")
          echo "HTTP $STATUS"
          cat /tmp/out.json
          [ "$STATUS" = "200" ]
