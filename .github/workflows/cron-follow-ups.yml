name: Cron - follow-ups

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

concurrency:
  group: cron-follow-ups
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call follow-ups endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          STATUS=$(curl -sS -o /tmp/out.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 120 \
            "$APP_URL/api/cron/follow-ups")
          echo "HTTP $STATUS"
          cat /tmp/out.json
          [ "$STATUS" = "200" ]
